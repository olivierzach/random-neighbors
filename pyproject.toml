[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "random-neighbors"
version = "0.1.0"
description = "Random Neighbors Clustering: random-forest-style feature bagging + clustering, plus unsupervised random forest proximity baseline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Zach Olivier"}]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["rnc*"]

[tool.ruff]
line-length = 100
